<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avail Car CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18302e; --muted:#5d6e6b; --line:#dde4e2;
  --side:#0e2625; --side-ink:#b9cdc9; --side-hover:#173735; --side-active:#1f4a46;
  --accent:#e4572e; --accent-ink:#ffffff; --accent-soft:#fdeae4;
  --focus:#2b7de9; --ok:#2f8f5b; --warn:#b7791f; --bad:#c43d3d;
  --shadow:0 1px 2px rgba(14,38,37,.06),0 6px 18px rgba(14,38,37,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1514; --surface:#122120; --ink:#e4eeec; --muted:#94a8a4; --line:#223634;
    --side:#07100f; --side-hover:#102322; --side-active:#183533;
    --accent-soft:#3a1e16; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1514; --surface:#122120; --ink:#e4eeec; --muted:#94a8a4; --line:#223634;
  --side:#07100f; --side-hover:#102322; --side-active:#183533;
  --accent-soft:#3a1e16; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:flex;height:100%}

/* sidebar */
.side{width:240px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;color:#fff;font-weight:700;font-size:20px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.nav{padding:6px 8px 20px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;color:inherit;border-radius:8px;text-align:left}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-active);color:#fff}
.nav-item svg.ic{width:18px;height:18px;flex:none}
.nav-item .chev{margin-left:auto;width:14px;height:14px;transition:transform .15s}
.nav-group.open>.nav-item .chev{transform:rotate(180deg)}
.sub{display:none;padding:2px 0 6px 39px;flex-direction:column;gap:1px}
.nav-group.open>.sub{display:flex}
.sub button{border:0;background:none;color:inherit;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.sub button:hover{background:var(--side-hover)}
.sub button.active{color:#fff;background:var(--side-active)}
.ver{margin-top:auto;padding:10px 18px 16px;font-size:12px;opacity:.6}
.scrim{display:none}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px}
.dash-title{display:flex;align-items:center;gap:8px;min-width:0}
.dash-title strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:none;padding:7px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.badge{position:absolute;top:1px;right:0;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;line-height:1.3}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;border:0}
.content{padding:20px;max-width:1500px;width:100%}

/* hero */
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.hero h1{margin:0 0 2px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.hero h1 b{color:var(--accent);font-weight:600}
.hero p{margin:0 0 14px;font-size:20px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.mau{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px;color:var(--muted)}
.mau strong{font-size:15px;color:var(--ink);font-weight:600}

/* analysis */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-head h2{margin:0;font-size:20px;font-weight:500}
.range{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.range input{border:0;background:none;padding:2px}
.range input::-webkit-calendar-picker-indicator{filter:var(--cal,none)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-head h3{margin:0;font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg)}
.tools{display:flex;gap:0}
.tools .icon-btn{padding:5px}
.tools .icon-btn svg{width:16px;height:16px}
.chart-box{position:relative}
.empty{display:grid;place-items:center;color:var(--muted);font-size:16px;text-align:center;padding:20px}
.restore{margin:12px 0 0;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 12px;color:var(--muted)}

/* tables / pages */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.94)}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--line)}
.pill.Disbursed,.pill.Received{color:var(--ok);border-color:currentColor;background:none}
.pill.Rejected,.pill.Overdue{color:var(--bad);border-color:currentColor;background:none}
.pill.Hold,.pill.Pending{color:var(--warn);border-color:currentColor;background:none}
.pill.Login{color:var(--focus);border-color:currentColor;background:none}
.more{display:block;margin:12px auto 0}
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.channel{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.channel:hover{border-color:var(--accent)}
.channel strong{font-size:14px}.channel span{color:var(--muted);font-size:12.5px}
.stub{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.stub h2{margin:0 0 6px;color:var(--ink)}

/* drawer + modal */
.overlay{position:fixed;inset:0;background:rgba(5,15,14,.5);z-index:50;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;transform:translateX(100%);transition:transform .2s;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;border-left:1px solid var(--line)}
.drawer.show{transform:none}
.drawer h2{margin:0 0 2px;font-size:20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:16px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border-radius:12px;padding:20px;z-index:60;display:none;border:1px solid var(--line)}
.modal.show{display:block}
.modal h2{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:500;font-size:13px}
.row{display:flex;gap:10px}.row .field{flex:1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}

.ph-title{display:flex;align-items:center;gap:6px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pw{position:relative}
.btn svg{width:16px;height:16px;vertical-align:-3px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sq{padding:8px 10px;display:inline-grid;place-items:center}
.searchbox{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:240px;flex:1 1 240px;max-width:380px}
.searchbox:focus-within{outline:2px solid var(--focus)}
.searchbox input{border:0;background:none;flex:1;padding:8px 10px;min-width:0}
.searchbox input:focus-visible{outline:none}
.pop{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:40;padding:8px}
.pop[hidden]{display:none}
.pop.r{left:auto;right:0}
.pop-top{display:flex;justify-content:space-between;gap:12px;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pop-top button{border:0;background:none;padding:2px 4px;font-weight:500}
.pop-top button:hover{color:var(--accent)}
.pop-list{max-height:280px;overflow-y:auto}
.chk{display:flex;gap:8px;align-items:center;padding:7px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.chk:hover{background:var(--bg)}
.chk .dot{margin:0}
.menu-item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;white-space:nowrap}
.menu-item:hover{background:var(--bg)}
.pop .field{margin-bottom:8px}
.fpanel{border:1px solid var(--line);background:var(--surface);border-radius:10px;margin-bottom:4px}
.fp-head{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:12px 16px;font-weight:600;border-radius:10px}
.fp-head svg{width:16px;height:16px;transition:transform .15s}
.fp-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.fp-body{padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:end}
.fp-body[hidden]{display:none}
.fp-body .field{margin:0}
.fp-body input,.fp-body select,.foot select,.pop input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tscroll{overflow-x:auto}
.th-sort{border:0;background:none;font:inherit;color:inherit;font-weight:600;padding:0;display:inline-flex;gap:5px;align-items:center}
.th-sort span{font-size:10px;opacity:.7}
td.dt{line-height:1.25}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.act{display:flex;gap:0}
.emptyrow{text-align:center;color:var(--muted);padding:34px 14px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.tc{color:var(--focus);font-weight:500}
.pager{display:flex;gap:10px;align-items:center}
.pager button{border:0;background:none;padding:4px 6px}
.pager button:disabled{opacity:.45;cursor:default}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(5,15,14,.5);z-index:25}
  .burger{display:inline-grid}
  .content{padding:14px}
}
.lead-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card-title{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-title small{font-weight:400;color:var(--muted);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .field{margin:0}
.fgrid input,.fgrid select,.card textarea,.fu-add input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.sec-label{grid-column:1/-1;margin:6px 0 -2px;font-weight:600;color:var(--muted);font-size:12.5px}
.statusbar{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px 0 12px}
.statusbar select{border:0;background:none;padding:8px 4px;font-weight:500}
a.btn{text-decoration:none;display:inline-block}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 12px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.checklist{list-style:none;margin:0;padding:0;display:grid}
.checklist .chk{padding:8px 4px}
.fu-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fu-row .t{flex:1;min-width:0}
.fu-row.done .t{text-decoration:line-through;color:var(--muted)}
.fu-row time{color:var(--muted);font-size:12.5px;white-space:nowrap}
.fu-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fu-add input[type=text]{flex:1;min-width:150px;width:auto}
.fu-add input[type=date]{width:auto}
.fu-empty{color:var(--muted);margin:0}
.noteform{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.timeline{list-style:none;margin:16px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:14px}
.timeline li{position:relative;padding-left:14px}
.timeline li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.timeline li.status::before{background:var(--accent)}
.timeline li.note::before{background:var(--focus)}
.timeline p{margin:0;overflow-wrap:anywhere}
.timeline time{color:var(--muted);font-size:12.5px}
@media (max-width:900px){.lead-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.wa{color:var(--ok);display:inline-block;vertical-align:-3px;margin-left:4px}
.wa svg{width:15px;height:15px}
.tb select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
td select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 12px;background:var(--bg)}
.tag .x{border:0;background:none;color:var(--muted);padding:0 4px;border-radius:50%}
.tag .x:hover{color:var(--bad)}
.stat-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stat-list li{display:flex;justify-content:space-between;gap:12px}
.stat-list small{color:var(--muted)}
.dlnote{margin:10px 0;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 8px}
.csvbox{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;margin-top:10px}
.center th,.center td{text-align:center}
.striped tbody tr:nth-child(even){background:var(--bg)}
.seg-eye{color:#4a90e2}.seg-edit{color:var(--accent)}
.warn{color:var(--bad);font-size:12px;margin:2px 0 0}
.noreq{text-align:center;font-size:22px;color:var(--muted);padding:34px 14px;opacity:.75}
.bigcount{font-size:34px;font-weight:600;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.tab{border:0;background:none;padding:10px 22px;border-radius:8px;color:var(--ink)}
.tab:hover{background:var(--surface)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);font-weight:500}
.center .l{text-align:left}
.inline-chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.badge-btn{border:0;background:#f2c14e;color:#4a3500;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:8px}
.st-active{color:#2b7de9}.st-inactive{color:var(--bad)}
.total{font-size:18px;white-space:nowrap;margin-right:2px}
.rep{color:var(--bad);margin-left:12px;font-weight:600}
.perm-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.perm-roles{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px}
.perm-roles button{border:0;background:none;text-align:left;padding:14px 16px;border-radius:8px;color:var(--ink)}
.perm-roles button:hover{background:var(--surface)}
.perm-roles button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.perm-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding-bottom:64px}
.perm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 18px;border-bottom:1px solid var(--line)}
.perm-row .land{display:flex;gap:8px;align-items:center;color:var(--ink);white-space:nowrap}
.perm-row .land.off{color:var(--muted);opacity:.7}
.perm-acts{padding:2px 18px 14px;border-bottom:1px solid var(--line)}
.perm-acts h4{margin:10px 0 6px;font-size:15px}
.acts-grid{display:flex;flex-wrap:wrap;gap:0 18px}
.perm-submit{position:fixed;right:24px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25)}

.sumbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.sum-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.sum-card:hover{border-color:var(--muted)}
.sum-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sum-card b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sum-label{color:var(--muted);font-size:13px;display:flex;align-items:center}
.sum-files{color:var(--muted);font-size:13px}
.pop.wide{min-width:310px}
.pop select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.repcard{margin-bottom:12px}
.repbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-btn{border:0;background:var(--surface);padding:7px 14px}
.seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.repscroll thead th{position:sticky;top:0}
.repscroll tfoot td{background:var(--bg);position:sticky;bottom:0}
.linkbtn{border:0;background:none;color:var(--focus);font-weight:500;padding:6px 0}

.sub-head h2{margin:0;font-size:20px;font-weight:500}
.sub-head p{margin:2px 0 0;color:var(--muted)}
.def-note{color:var(--muted)}

.bulk-card:hover{border-color:var(--muted)}

.bc-main svg{width:24px;height:24px}
.bc-tools{position:absolute;top:6px;right:6px;display:flex;gap:2px;z-index:1}
.bc-tools .icon-btn{padding:4px;color:var(--muted)}
.bc-tools .icon-btn svg{width:15px;height:15px}
.bulk-card.add .bc-main{align-items:center;justify-content:center}
.bulk-card.add .plus{font-size:34px;line-height:1;font-weight:300}
.bulk-card.off{opacity:.55}
.plugin{display:flex;align-items:center;gap:10px;margin-top:18px}
.sw{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:#1f9d55}
.sw:checked::after{transform:translateX(16px)}
.modal.wide{width:min(900px,calc(100% - 24px))}
.paytotal{margin:12px 0}
.modal .kpis{margin:10px 0}

.appcard{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}

function destroyCharts(){Object.keys(charts).forEach(function(k){charts[k].destroy();});charts={};}
function drawCharts(){
  destroyCharts();
  var tick=css("--muted"), line=css("--line"), ink=css("--ink");
  state.widgets.forEach(function(w){
    var box=document.querySelector('[data-w="'+w.id+'"] .chart-box'); if(!box)return;
    var rows=leads.filter(function(l){return inRange(l)&&(w.kind==="pdd"?l.stage==="Disbursed":(w.stages||[w.stage]).indexOf(l.stage)>-1);});
    if(!rows.length||typeof Chart==="undefined"){box.innerHTML='<div class="empty" style="height:100%">'+(typeof Chart==="undefined"?"Charts could not load.":"No data available for this date range.")+'</div>';return;}
    var cv=document.createElement("canvas"); box.appendChild(cv);
    var cfg;
    if(w.kind==="pdd"){
      var ps=["Pending","Received","Overdue"], pc=["#f2a900","#3aa76d","#c43d3d"];
      cfg={type:"doughnut",data:{labels:ps,datasets:[{data:ps.map(function(p){return rows.filter(function(l){return l.pdd===p;}).length;}),backgroundColor:pc,borderColor:css("--surface"),borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{color:ink,usePointStyle:true}}}}};
    } else {
      var own=owners.filter(function(o){return rows.some(function(l){return l.owner===o;});});
      cfg={type:"bar",data:{labels:own.map(function(o){return o.length>11?o.slice(0,10)+"…":o;}),datasets:products.map(function(p,pi){
        return {label:p,backgroundColor:pcolor[pi],stack:"s",data:own.map(function(o){return rows.filter(function(l){return l.owner===o&&l.product===p;}).reduce(function(s,l){return s+l.amount;},0);})};})},
        options:{responsive:true,maintainAspectRatio:false,
          scales:{x:{stacked:true,grid:{display:false},ticks:{color:tick},title:{display:true,text:"Lead owner",color:ink}},
                  y:{stacked:true,grid:{color:line},ticks:{color:tick,callback:function(v){return "₹"+short(v);}},title:{display:true,text:"Loan amount",color:ink}}},
          plugins:{legend:{position:"bottom",labels:{color:ink,usePointStyle:true,boxWidth:8}},
                   tooltip:{callbacks:{label:function(c){return c.dataset.label+": "+money(c.parsed.y);}}}}}};
    }
    charts[w.id]=new Chart(cv,cfg);
  });
}

function leadRows(key,noSel){
  var st=pageStages(key), q=state.q.trim().toLowerCase(), f=state.f, lr=getRange(key), sf=state.sf;
  var rows=leads.filter(function(l){
    if(st.indexOf(l.stage)<0)return false;
    if(key.indexOf("cat")===0){if(l.cat!==key)return false;}else if(l.cat&&key!=="data"&&key!=="channel")return false;
    if(l.date<lr.from||l.date>lr.to)return false;
    if(key==="pdd"&&l.status!=="Disburse")return false;
    if(!noSel&&state.sel.length&&state.sel.indexOf(key==="pdd"?l.pdd:l.status)<0)return false;
    if(f.product&&l.product!==f.product)return false;
    if(f.lender&&l.lender!==f.lender)return false;
    if(f.dealer&&l.dealer!==f.dealer)return false;
    if(f.owner&&l.owner!==f.owner)return false;
    if(f.min!==""&&l.amount<+f.min)return false;
    if(f.max!==""&&l.amount>+f.max)return false;
    if(f.veh&&(l.reg+" "+l.vehicle).toLowerCase().indexOf(f.veh.toLowerCase())<0)return false;
    if(q){
      var hay=[];
      if(sf.name)hay.push(l.name);
      if(sf.phone)hay.push(l.phone);
      if(sf.veh)hay.push(l.reg,l.vehicle);
      if(sf.lender)hay.push(l.lender);
      if(sf.dealer)hay.push(l.dealer);
      if(hay.join(" ").toLowerCase().indexOf(q)<0)return false;
    }
    return true;
  });
  var s=state.sort;
  rows.sort(function(a,b){var x=a[s.k],y=b[s.k];return (x>y?1:x<y?-1:0)*s.d;});
  return rows;
}

function spanLabel(a,b){var x=MON[a.getMonth()],y=MON[b.getMonth()];return a.getFullYear()===b.getFullYear()?x+"–"+y+" "+a.getFullYear():x+" "+a.getFullYear()+"–"+y+" "+b.getFullYear();}
function periodList(kind,basis){
  var t=TODAY,y=t.getFullYear(),m=t.getMonth(),len=kind==="Q"?3:6,n=kind==="Q"?8:4,sm=basis==="fy"?3:0,out=[];
  var off=((m-sm)%12+12)%12, idx=Math.floor(off/len), yr=m>=sm?y:y-1;
  for(var i=0;i<n;i++){
    var sd=new Date(yr,sm+idx*len,1), ed=new Date(yr,sm+idx*len+len,0);
    var lab=(kind==="Q"?"Q":"H")+(idx+1)+" "+(basis==="fy"?"FY "+yr+"-"+String(yr+1).slice(2):yr)+" ("+spanLabel(sd,ed)+")";
    out.push({from:ymd(sd),to:ymd(ed),label:lab});
    idx--; if(idx<0){idx=12/len-1;yr--;}
  }
  return out;
}
function periodOptions(kind,key){
  return '<option value="">Choose a '+(kind==="Q"?"quarter":"half year")+'</option>'+periodList(kind,state.fyBasis).map(function(o){return '<option value="'+o.from+'|'+o.to+'|'+esc(o.label)+'"'+(state.rlabel[key]===o.label?" selected":"")+'>'+esc(o.label)+'</option>';}).join("");
}

async function saveCsv(name,csv,fid){
  var dl=null;
  try{ if(typeof window!=="undefined"&&window.claude&&window.claude.use)dl=await window.claude.use("downloads"); }catch(e){dl=null;}
  if(!dl){var tx=document.getElementById(fid||"repFallback");if(tx){tx.hidden=false;tx.value=csv;tx.focus();tx.select();}toast("Direct download is not available here. Copy the data below.");return;}
  try{ await dl.save({filename:name,data:csv}); toast("Download started"); }
  catch(e){ if(e&&e.code==="declined")return; toast("Could not save the file"); }
}

function importCSV(file){
  var rd=new FileReader();
  rd.onload=function(){
    var lines=String(rd.result).split(/\r?\n/), n=0;
    lines.forEach(function(ln,i){
      var c=ln.split(",").map(function(x){return x.trim();});
      if(!c[0]||(i===0&&/name/i.test(c[0])))return;
      newLead({name:c[0],phone:c[1],product:products.indexOf(c[2])>-1?c[2]:products[0],amount:+c[3]||0}); n++;
    });
    state.page=1; renderTable(); toast(n+" lead"+(n===1?"":"s")+" imported");
  };
  rd.readAsText(file);
}

function ensure(l){
  if(l.hist)return l;
  l.hist=[];
  if(l.status!=="Open")l.hist.push({ts:l.ts,text:"Status set to "+l.status,type:"status"});
  l.hist.push({ts:l.ts,text:"Lead created from "+l.source,type:"system"});
  l.docs={};
  DOCS.forEach(function(n,i){l.docs[n]=l.stage==="Audience"?(i===0&&l.id%2===0):((l.id*7+i*3)%5)<(l.stage==="Disbursed"?5:3);});
  l.fu=[];
  if(l.stage==="Login"||l.stage==="Hold"||l.id%3===0){
    var dt=new Date(TODAY);dt.setDate(dt.getDate()+(l.id%2?-1-(l.id%3):1+(l.id%4)));
    l.fu.push({date:ymd(dt),text:l.stage==="Hold"?"Call customer about the hold reason":"Call customer for pending documents",done:false});
  }
  return l;
}

function changeStatus(ns){
  var l=curLead(); if(!l)return; ensure(l);
  var old=l.status; if(ns===old)return;
  l.status=ns; l.stage=statusStage[ns];
  l.pdd=l.stage==="Disbursed"?(l.pdd==="—"?"Pending":l.pdd):"—";
  l.hist.unshift({ts:stamp(),text:"Status changed from "+old+" to "+ns,type:"status"});
  renderLead(); toast("Status updated");
}
function saveDetails(){
  var l=curLead(); if(!l)return; ensure(l);
  var nm=document.getElementById("ld_name").value.trim();
  if(!nm){toast("Enter a name");document.getElementById("ld_name").focus();return;}
  var changed=[];
  DETAIL.forEach(function(f){
    var el=document.getElementById("ld_"+f[0]); if(!el)return;
    var val=f[0]==="amount"?(+el.value||0):(f[0]==="name"?nm:el.value.trim());
    if(val!==l[f[0]]){l[f[0]]=val;changed.push(f[1]);}
  });
  if(!changed.length){toast("No changes to save");return;}
  l.hist.unshift({ts:stamp(),text:"Details updated: "+changed.join(", "),type:"system"});
  renderLead(); toast("Details saved");
}
function addNote(){

function addFu(){
  var l=curLead(); if(!l)return; ensure(l);
  var dt=document.getElementById("fuDate").value, tx=document.getElementById("fuText").value.trim();
  if(!dt||!tx){toast("Add a date and what needs to happen");return;}

  l.hist.unshift({ts:stamp(),text:"Follow-up scheduled for "+fmtDate(dt)+": "+tx,type:"system"});
  renderLead(); toast("Follow-up scheduled");

function toggleFu(i,done){
  var l=curLead(); if(!l)return; var f=l.fu[i]; if(!f)return;
  f.done=done;
  if(done)l.hist.unshift({ts:stamp(),text:"Follow-up completed: "+f.text,type:"system"});
  renderLead();
  var el=document.querySelector('[data-fu="'+i+'"]'); if(el)el.focus();
}
function toggleDoc(i,got){
  var l=curLead(); if(!l)return; var n=DOCS[i]; if(!n)return;
  l.docs[n]=got;
  l.hist.unshift({ts:stamp(),text:(got?"Document received: ":"Document marked pending: ")+n,type:"system"});
  renderLead();
  var el=document.querySelector('[data-doc="'+i+'"]'); if(el)el.focus();

function parseCSV(t){
  var rows=[],row=[],f="",q=false,i,c; t=t.replace(/^\ufeff/,"");
  for(i=0;i<t.length;i++){
    c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);if(row.length>1||row[0]!=="")rows.push(row);}
  return rows;
}
function bulkImportText(text){
  var rows=parseCSV(text); if(rows.length<2)return {err:"The file has no data rows."};
  var map={};
  rows[0].forEach(function(h,i){var n=h.trim().toLowerCase(),a=allAttrs().filter(function(x){return x.label.toLowerCase()===n||x.key===n;})[0];if(a&&map[a.key]===undefined)map[a.key]=i;});
  if(map.name===undefined||map.mobile===undefined)return {err:"The first row must include Name and Mobile columns."};
  var ok=0,skip=0;
  rows.slice(1).forEach(function(r){
    function g(k){return map[k]===undefined?"":String(r[map[k]]||"").trim();}
    var nm=g("name"),ph=g("mobile").replace(/\D/g,"").slice(-10);
    if(!nm||ph.length!==10){skip++;return;}
    var l=newLead({name:nm,phone:ph,amount:+g("loan_amount").replace(/[^0-9.]/g,"")||0,vehicle:g("vehicle_model"),lender:g("lender"),dealer:g("dealer")});
    var pr=g("product"); l.product=products.indexOf(pr)>-1?pr:""; l.reg=g("vehicle_number"); ok++;
  });
  return {ok:ok,skip:skip};
}
function bulkImportClick(){
  var el=document.getElementById("bulkFile"), file=el&&el.files&&el.files[0];
  if(!file){toast("Choose a CSV file first");return;}
  var rd=new FileReader();

    var r=bulkImportText(String(rd.result));
    if(r.err){toast(r.err);return;}
    closeAll();toast(r.ok+" lead"+(r.ok===1?"":"s")+" imported to Audience"+(r.skip?", "+r.skip+" skipped":""));
  };
  rd.readAsText(file);
}

/* receipt */
function inWords(n){
  n=Math.round(n); if(n===0)return "Zero";
  var a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(x){return x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");}
  function three(x){return (x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");}
  var cr=Math.floor(n/1e7);n%=1e7;var lk=Math.floor(n/1e5);n%=1e5;var th=Math.floor(n/1e3);n%=1e3;var o=[];
  if(cr)o.push(three(cr)+" Crore"); if(lk)o.push(two(lk)+" Lakh"); if(th)o.push(two(th)+" Thousand"); if(n)o.push(three(n));
  return o.join(" ");
}

  if(d.tool){
    var card=t.closest("[data-w]"),w=state.widgets.filter(function(x){return x.id===card.dataset.w;})[0],a=d.tool;
    if(a==="del"){state.widgets=state.widgets.filter(function(x){return x!==w;});state.removed.push(w);renderDashboard();toast("Chart removed");}
    else if(a==="zin"){w.h=Math.min((w.h||H0)+60,520);renderDashboard();}
    else if(a==="zout"){w.h=Math.max((w.h||H0)-60,180);renderDashboard();}
    else if(a==="wide"){w.wide=!w.wide;renderDashboard();}
    else if(a==="reset"){w.h=null;w.wide=false;renderDashboard();}
    else if(a==="edit"){
      var h3=card.querySelector("h3"),inp=document.createElement("input");inp.value=w.title;h3.replaceWith(inp);inp.focus();inp.select();
      var done=function(){w.title=inp.value.trim()||w.title;var n=document.createElement("h3");n.textContent=w.title;inp.replaceWith(n);};
      inp.addEventListener("keydown",function(ev){if(ev.key==="Enter")inp.blur();});inp.addEventListener("blur",done);}
    return;}
  if(t.id==="restore"){state.widgets=state.widgets.concat(state.removed);state.removed=[];renderDashboard();return;}
  if(t.id==="saveLead"){
    var nm=document.getElementById("aName").value.trim();if(!nm){document.getElementById("aName").focus();toast("Enter the lead's name");return;}
    newLead({name:nm,phone:document.getElementById("aPhone").value.trim(),owner:document.getElementById("aOwner").value,product:document.getElementById("aProd").value,amount:+document.getElementById("aAmt").value||0,vehicle:document.getElementById("aVeh").value.trim(),lender:document.getElementById("aLender").value,dealer:document.getElementById("aDealer").value});
    state.page=1;closeAll();renderTable();toast("Lead added");return;}
  if(t.id==="saveCamp"){
    var cn=document.getElementById("cName").value.trim();if(!cn){document.getElementById("cName").focus();toast("Name the campaign");return;}
    campaigns.unshift({name:cn,channel:document.getElementById("cChan").value,segment:document.getElementById("cSeg").value,when:document.getElementById("cWhen").value,status:"Scheduled"});
    closeAll();go("campaign");toast("Campaign scheduled");return;}
  if(t.id==="burger"){document.getElementById("side").classList.add("open");document.getElementById("scrim").classList.add("show");return;}
  if(t.id==="themeBtn"){var root=document.documentElement,dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.dataset.theme=dark?"light":"dark";redrawCharts();return;}
  if(t.id==="searchBtn"){go("leads/data");setTimeout(function(){var q=document.getElementById("q");if(q)q.focus();},0);return;}
  if(t.id==="bellBtn"){toast("13 new notifications");return;}
  if(t.id==="renameDash"){var sp=document.getElementById("dashName"),ip=document.createElement("input");ip.value=sp.textContent;ip.setAttribute("aria-label","Dashboard name");sp.replaceWith(ip);ip.focus();ip.select();
    var fin=function(){var n=document.createElement("strong");n.id="dashName";n.textContent=ip.value.trim()||"Dashboard";ip.replaceWith(n);};
    ip.addEventListener("blur",fin);ip.addEventListener("keydown",function(ev){if(ev.key==="Enter")ip.blur();});return;}
});
document.getElementById("scrim").addEventListener("click",function(){document.getElementById("side").classList.remove("open");this.classList.remove("show");});
document.addEventListener("change",function(e){
  var t=e.target,d=t.dataset||{};
  if(t.id==="rFrom"||t.id==="rTo"){
    var f1=document.getElementById("rFrom").value,t1=document.getElementById("rTo").value;
    if(f1&&t1&&f1<=t1){state.range={from:f1,to:t1};drawCharts();}else toast("Pick a start date before the end date");return;}
  if(t.id==="payBasis"){state.fyBasis=t.value;if(/^[qh]/.test(state.pay.opt))payApply(state.pay.opt);renderPayments();return;}
  if(t.id==="payPeriod"){if(t.value==="custom"){state.pay.opt="custom";state.pay.label=fmtDate(state.pay.from)+" to "+fmtDate(state.pay.to);}else payApply(t.value);renderPayments();return;}
  if(t.id==="payFrom"||t.id==="payTo"){var pf=document.getElementById("payFrom").value,pt=document.getElementById("payTo").value;if(pf&&pt&&pf<=pt){state.pay.from=pf;state.pay.to=pt;state.pay.opt="custom";state.pay.label=fmtDate(pf)+" to "+fmtDate(pt);renderPayments();}else toast("Pick a start date before the end date");return;}
  if(d.pcall!==undefined){var on=t.checked;[].slice.call(document.querySelectorAll("input[data-pc]")).forEach(function(c){c.checked=on;});payRecalc();return;}
  if(d.pc!==undefined){payRecalc();return;}
  if(t.id==="plugActive"){state.bulkOn=t.checked;renderIntegration();return;}
  if(t.id==="pdBasis"){state.fyBasis=t.value;var kq=document.getElementById("pdQ"),kh=document.getElementById("pdH");if(kq)kq.innerHTML=periodOptions("Q",pageKey());if(kh)kh.innerHTML=periodOptions("H",pageKey());return;}
  if(t.id==="pdQ"||t.id==="pdH"){if(!t.value)return;var pr=t.value.split("|");applyPeriod(pr[0],pr[1],pr[2]);return;}
  if(t.id==="lrFrom"||t.id==="lrTo"){
    var f2=document.getElementById("lrFrom").value,t2=document.getElementById("lrTo").value;
    if(f2&&t2&&f2<=t2){setRange(pageKey(),{from:f2,to:t2});clearPeriodLabel();state.page=1;renderTable();}else toast("Pick a start date before the end date");return;}
  if(d.status!==undefined){var ix=state.sel.indexOf(d.status);if(t.checked&&ix<0)state.sel.push(d.status);if(!t.checked&&ix>-1)state.sel.splice(ix,1);state.page=1;renderTable();return;}
  if(d.col){colState(pageKey())[d.col]=t.checked;renderTable();return;}
  if(d.sf){state.sf[d.sf]=t.checked;renderTable();return;}
  if(t.id==="daFrom"||t.id==="daTo"){var a1=document.getElementById("daFrom").value,a2=document.getElementById("daTo").value;if(a1&&a2&&a1<=a2){state.arange={from:a1,to:a2};reloadData();}else toast("Pick a start date before the end date");return;}
  if(t.id==="rpProd"){state.rprod=t.value;reloadData();return;}
  if(t.id==="dlType"){state.dltype=t.value;renderDownload();return;}
  if(d.dlcol){state.dl.cols[d.dlcol]=t.checked;return;}
  if(t.id==="ufRole"){state.uf.role=t.value;renderUBody();return;}
  if(t.id==="ufStatus"){state.uf.status=t.value;renderUBody();return;}
  if(d.urole!==undefined){changeUserRole(+d.urole,+t.value);return;}
  if(d.ushift!==undefined){users[+d.ushift].shift=t.value?+t.value:null;toast("Shift updated");return;}
  if(d.pm!==undefined){
    var pd=permCur();pd.m[d.pm]=t.checked;
    (PERM[d.pm]||[]).forEach(function(sec){sec[1].forEach(function(it){pd.i[d.pm+"::"+it]=t.checked;});});
    if(!t.checked&&pd.land===d.pm)pd.land="";
    renderUBody();var fe=document.querySelector('[data-pm="'+d.pm+'"]');if(fe)fe.focus();return;}
  if(d.pl!==undefined){var pl=permCur();pl.land=t.checked?d.pl:(pl.land===d.pl?"":pl.land);renderUBody();var fl=document.querySelector('[data-pl="'+d.pl+'"]');if(fl)fl.focus();return;}
  if(d.pi!==undefined){permCur().i[d.pi]=t.checked;return;}
  if(d.uact!==undefined){users[+d.uact].active=t.checked;toast(t.checked?"User activated":"User deactivated");return;}
  if(t.id==="setTheme"){applyTheme(t.value);return;}
  if(t.id==="setSize"){state.size=+t.value;toast("Saved");return;}
  if(t.id==="setRange"){var n=+t.value,fr=new Date(TODAY);fr.setDate(fr.getDate()-(n-1));state.lrange={from:ymd(fr),to:ymd(TODAY)};toast("Saved");return;}
  if(t.id==="ldStatus"){changeStatus(t.value);return;}
  if(d.doc!==undefined){toggleDoc(+d.doc,t.checked);return;}
  if(d.fu!==undefined){toggleFu(+d.fu,t.checked);return;}
  if(t.id==="pSize"){state.size=+t.value;state.page=1;renderTable();return;}
  if(t.id==="csvIn"&&t.files&&t.files[0]){importCSV(t.files[0]);t.value="";return;}
  if(d.f&&t.tagName==="SELECT"){state.f[d.f]=t.value;state.page=1;renderTable();}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="uQ"){state.uq=t.value;renderUBody();return;}
  if(t.id==="segQ"){state.segQ=t.value;renderSegTable();return;}
  if(t.id==="q"){state.q=t.value;state.page=1;renderTable();return;}
  if(t.dataset&&t.dataset.f&&t.tagName==="INPUT"){state.f[t.dataset.f]=t.value;state.page=1;renderTable();}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closePops();closeAll();}});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="pfQ"){state.pf.q=t.value;renderPayments();payRefocus("pfQ");return;}
  if(t.id==="hfQ"){state.hf.q=t.value;renderPayments();payRefocus("hfQ");return;}
});
document.addEventListener("change",function(e){
  var t=e.target,m={pfSt:["pf","st"],hfDealer:["hf","dealer"],hfMode:["hf","mode"],hfSt:["hf","st"],hfFrom:["hf","from"],hfTo:["hf","to"]};
  if(m[t.id]){state[m[t.id][0]][m[t.id][1]]=t.value;renderPayments();}
});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){redrawCharts();});}catch(_){}
render();
})();
</script>
