<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avail Car CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f4; --surface:#ffffff; --ink:#18302e; --muted:#5d6e6b; --line:#dde4e2;
  --side:#0e2625; --side-ink:#b9cdc9; --side-hover:#173735; --side-active:#1f4a46;
  --accent:#e4572e; --accent-ink:#ffffff; --accent-soft:#fdeae4;
  --focus:#2b7de9; --ok:#2f8f5b; --warn:#b7791f; --bad:#c43d3d;
  --shadow:0 1px 2px rgba(14,38,37,.06),0 6px 18px rgba(14,38,37,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1514; --surface:#122120; --ink:#e4eeec; --muted:#94a8a4; --line:#223634;
    --side:#07100f; --side-hover:#102322; --side-active:#183533;
    --accent-soft:#3a1e16; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1514; --surface:#122120; --ink:#e4eeec; --muted:#94a8a4; --line:#223634;
  --side:#07100f; --side-hover:#102322; --side-active:#183533;
  --accent-soft:#3a1e16; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:flex;height:100%}

/* sidebar */
.side{width:240px;flex:none;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;color:#fff;font-weight:700;font-size:20px;letter-spacing:-.01em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.nav{padding:6px 8px 20px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;color:inherit;border-radius:8px;text-align:left}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-active);color:#fff}
.nav-item svg.ic{width:18px;height:18px;flex:none}
.nav-item .chev{margin-left:auto;width:14px;height:14px;transition:transform .15s}
.nav-group.open>.nav-item .chev{transform:rotate(180deg)}
.sub{display:none;padding:2px 0 6px 39px;flex-direction:column;gap:1px}
.nav-group.open>.sub{display:flex}
.sub button{border:0;background:none;color:inherit;text-align:left;padding:7px 10px;border-radius:6px;font-size:13px}
.sub button:hover{background:var(--side-hover)}
.sub button.active{color:#fff;background:var(--side-active)}
.ver{margin-top:auto;padding:10px 18px 16px;font-size:12px;opacity:.6}
.scrim{display:none}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto}
.team-sel{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}.team-sel select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:var(--ink);font:inherit;max-width:240px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.burger{display:none;border:0;background:none;padding:6px}
.dash-title{display:flex;align-items:center;gap:8px;min-width:0}
.dash-title strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:none;padding:7px;border-radius:8px;color:var(--muted);display:inline-grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.badge{position:absolute;top:1px;right:0;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;line-height:1.3}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;border:0}
.content{padding:20px;max-width:1500px;width:100%}
.powered{margin-top:auto;padding:16px 20px;text-align:center;font-size:12px;letter-spacing:.04em;color:var(--muted);border-top:1px solid var(--line)}
table.hier td{vertical-align:top}.hwrap{display:flex;flex-wrap:wrap;gap:6px 14px;max-width:760px}.hchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap;cursor:pointer}
.powered b{color:var(--ink);font-weight:600}
.login-powered{margin:18px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.login-powered b{color:var(--ink);font-weight:600}

/* hero */
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.hero h1{margin:0 0 2px;font-size:22px;font-weight:500;letter-spacing:-.01em}
.hero h1 b{color:var(--accent);font-weight:600}
.hero p{margin:0 0 14px;font-size:20px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-size:13px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.mau{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:12px;color:var(--muted)}
.mau strong{font-size:15px;color:var(--ink);font-weight:600}

/* analysis */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.sec-head h2{margin:0;font-size:20px;font-weight:500}
.range{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.range input{border:0;background:none;padding:2px}
.range input::-webkit-calendar-picker-indicator{filter:var(--cal,none)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-head h3{margin:0;font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--bg)}
.tools{display:flex;gap:0}
.tools .icon-btn{padding:5px}
.tools .icon-btn svg{width:16px;height:16px}
.chart-box{position:relative}
.empty{display:grid;place-items:center;color:var(--muted);font-size:16px;text-align:center;padding:20px}
.restore{margin:12px 0 0;border:1px dashed var(--line);background:none;border-radius:8px;padding:8px 12px;color:var(--muted)}

/* tables / pages */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.94)}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--bg)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--bg);border:1px solid var(--line)}
.pill.Disbursed,.pill.Received{color:var(--ok);border-color:currentColor;background:none}
.pill.Rejected,.pill.Overdue{color:var(--bad);border-color:currentColor;background:none}
.pill.Hold,.pill.Pending{color:var(--warn);border-color:currentColor;background:none}
.pill.Login{color:var(--focus);border-color:currentColor;background:none}
.more{display:block;margin:12px auto 0}
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:22px}
.channel{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.channel:hover{border-color:var(--accent)}
.channel strong{font-size:14px}.channel span{color:var(--muted);font-size:12.5px}
.stub{border:1px dashed var(--line);border-radius:12px;padding:40px 24px;text-align:center;color:var(--muted);background:var(--surface)}
.stub h2{margin:0 0 6px;color:var(--ink)}

/* drawer + modal */
.overlay{position:fixed;inset:0;background:rgba(5,15,14,.5);z-index:50;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:60;transform:translateX(100%);transition:transform .2s;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;border-left:1px solid var(--line)}
.drawer.show{transform:none}
.drawer h2{margin:0 0 2px;font-size:20px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:16px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface);border-radius:12px;padding:20px;z-index:60;display:none;border:1px solid var(--line)}
.modal.show{display:block}
.sg-card{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px}
.sg-card>h3{border-radius:10px 10px 0 0;margin:0;padding:12px 20px;background:var(--bg);font-size:18px;font-weight:400;border-bottom:1px solid var(--line)}
.sg-body{padding:18px 20px}
.sg-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sg-row>label{min-width:70px;color:var(--ink)}
.sg-row input,.sg-row select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--ink);font:inherit}
.sg-row .grow{flex:1;min-width:200px}
.sg-note{color:var(--muted);margin:0 0 16px}
.sg-f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.sg-f .dotm{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.sg-f .lbl{width:92px;color:var(--ink)}
.sg-vals{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:240px;border-bottom:1px solid var(--line);padding:4px 0;min-height:36px}
.sg-chip{border:0;background:#c4193b;color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:3px;cursor:pointer}
.sg-vals select{border:0!important;padding:4px!important;max-width:150px;color:var(--muted)}
.sg-x{border:0;background:none;font-size:20px;line-height:1;color:var(--ink);cursor:pointer;padding:4px 10px}
.sg-and{display:flex;align-items:center;gap:12px;margin:10px 0;border-top:1px solid var(--line);padding-top:12px}
.sg-and span{border:1px solid var(--line);border-radius:4px;padding:6px 10px;color:var(--ink);background:var(--surface)}
.sg-dd{position:relative}.sg-caret{border:0;background:none;margin-left:auto;color:var(--muted);cursor:pointer;padding:4px}
.sg-panel{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px}
.sg-panel input{width:100%;margin-bottom:4px}
.sg-list{max-height:210px;overflow:auto}
.sg-opt{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font:inherit;color:var(--ink);cursor:pointer}
.sg-opt:hover{background:var(--bg)}.sg-opt.on{background:var(--bg);color:#c4193b;font-weight:600}
.sg-none{padding:10px 12px;color:var(--muted)}
.sg-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

.modal.eu{padding:0;width:min(470px,calc(100% - 24px))}
.eu-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.eu-head h2{margin:0;font-size:18px;font-weight:500}
.eu-body{padding:16px 18px 18px}
.eu-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eu-link{border:0;background:none;padding:4px 0;color:#2b7de9;font:inherit;cursor:pointer}
.eu-link:hover{text-decoration:underline}
.eu-link.danger{color:#c43d3d}
.eu-tg{display:flex;align-items:center;gap:8px;color:var(--ink)}
.sw{width:34px;height:18px;border-radius:9px;border:0;background:#c9d1d0;position:relative;padding:0;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:#2fb35a}
.sw[aria-checked="true"]::after{left:18px}
.eu select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.eu-sel{margin:14px 0}

.modal h2{margin:0 0 14px;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-weight:500;font-size:13px}
.row{display:flex;gap:10px}.row .field{flex:1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:80}
.toast.show{opacity:1;transform:translateX(-50%)}

.ph-title{display:flex;align-items:center;gap:6px}
.tb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pw{position:relative}
.btn svg{width:16px;height:16px;vertical-align:-3px}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.sq{padding:8px 10px;display:inline-grid;place-items:center}
.searchbox{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:240px;flex:1 1 240px;max-width:380px}
.searchbox:focus-within{outline:2px solid var(--focus)}
.searchbox input{border:0;background:none;flex:1;padding:8px 10px;min-width:0}
.searchbox input:focus-visible{outline:none}
.pop{position:absolute;top:calc(100% + 8px);left:0;min-width:220px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.2);z-index:40;padding:8px}
.pop[hidden]{display:none}
.pop.r{left:auto;right:0}
.pop-top{display:flex;justify-content:space-between;gap:12px;padding:2px 4px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.pop-top button{border:0;background:none;padding:2px 4px;font-weight:500}
.pop-top button:hover{color:var(--accent)}
.pop-list{max-height:280px;overflow-y:auto}
.chk{display:flex;gap:8px;align-items:center;padding:7px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.chk:hover{background:var(--bg)}
.chk .dot{margin:0}
.menu-item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;white-space:nowrap}
.menu-item:hover{background:var(--bg)}
.pop .field{margin-bottom:8px}
.fpanel{border:1px solid var(--line);background:var(--surface);border-radius:10px;margin-bottom:4px}
.fp-head{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:12px 16px;font-weight:600;border-radius:10px}
.fp-head svg{width:16px;height:16px;transition:transform .15s}
.fp-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.fp-body{padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-items:end}
.fp-body[hidden]{display:none}
.fp-body .field{margin:0}
.fp-body input,.fp-body select,.foot select,.pop input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tscroll{overflow-x:auto}
.firmbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}.firmbar select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:200px}.pddbar{align-items:flex-end}.pddbar input[type=date]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}.pddbar .field{display:flex;flex-direction:column;gap:4px}.firmbar label{font-size:13px;color:var(--muted)}.firmbar input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:220px}
#tbl .tscroll{overflow:auto;max-height:calc(100vh - 290px);min-height:260px;-webkit-overflow-scrolling:touch}
#tbl .tscroll::-webkit-scrollbar,#tbl .hbar::-webkit-scrollbar{height:14px;width:14px}
#tbl .tscroll::-webkit-scrollbar-track,#tbl .hbar::-webkit-scrollbar-track{background:var(--bg)}
#tbl .tscroll::-webkit-scrollbar-thumb,#tbl .hbar::-webkit-scrollbar-thumb{background:#8aa09c;border-radius:8px;border:3px solid var(--bg)}
#tbl .hbar{position:sticky;bottom:0;z-index:5;overflow-x:scroll;overflow-y:hidden;height:16px;background:var(--bg);border-top:1px solid var(--line);scrollbar-width:auto}
#tbl .hbar>div{height:1px}
#tbl .tscroll thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
.th-sort{border:0;background:none;font:inherit;color:inherit;font-weight:600;padding:0;display:inline-flex;gap:5px;align-items:center}
.th-sort span{font-size:10px;opacity:.7}
td.dt{line-height:1.25}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.act{display:flex;gap:0}
.emptyrow{text-align:center;color:var(--muted);padding:34px 14px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
.tc{color:var(--focus);font-weight:500}
.pager{display:flex;gap:10px;align-items:center}
.pager button{border:0;background:none;padding:4px 6px}
.pager button:disabled{opacity:.45;cursor:default}
@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(5,15,14,.5);z-index:25}
  .burger{display:inline-grid}
  .content{padding:14px}
}
.lead-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card-title{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-title small{font-weight:400;color:var(--muted);font-size:12.5px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .field{margin:0}
.fgrid input,.fgrid select,.card textarea,.fu-add input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.sec-label{grid-column:1/-1;margin:6px 0 -2px;font-weight:600;color:var(--muted);font-size:12.5px}
.st-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}
.st-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:12px 14px;cursor:pointer}
.st-pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-note{margin-top:16px}.st-note textarea{width:100%;min-height:72px}
.st-sub{display:flex;justify-content:flex-end;margin-top:12px}
@media (max-width:1100px){.st-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.statusbar{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 8px 0 12px}
.statusbar select{border:0;background:none;padding:8px 4px;font-weight:500}
a.btn{text-decoration:none;display:inline-block}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 12px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.checklist{list-style:none;margin:0;padding:0;display:grid}
.checklist .chk{padding:8px 4px}
.fu-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fu-row .t{flex:1;min-width:0}
.fu-row.done .t{text-decoration:line-through;color:var(--muted)}
.fu-row time{color:var(--muted);font-size:12.5px;white-space:nowrap}
.fu-add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fu-add input[type=text]{flex:1;min-width:150px;width:auto}
.fu-add input[type=date]{width:auto}
.fu-empty{color:var(--muted);margin:0}
.remark-cell{display:block;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld-name-remark{margin:6px 0 10px;padding:7px 10px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:5px;font-size:12px;line-height:1.45;max-width:100%;overflow-wrap:anywhere}
.ld-name-remark strong{font-weight:700}
.noteform{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.timeline{list-style:none;margin:16px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:14px}
.timeline li{position:relative;padding-left:14px}
.timeline li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.timeline li.status::before{background:var(--accent)}
.timeline li.note::before{background:var(--focus)}
.timeline p{margin:0;overflow-wrap:anywhere}
.timeline time{color:var(--muted);font-size:12.5px}
@media (max-width:900px){.lead-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.wa{color:var(--ok);display:inline-block;vertical-align:-3px;margin-left:4px}
.wa svg{width:15px;height:15px}
.tb select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
td select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 6px 3px 12px;background:var(--bg)}
.tag .x{border:0;background:none;color:var(--muted);padding:0 4px;border-radius:50%}
.tag .x:hover{color:var(--bad)}
.stat-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.stat-list li{display:flex;justify-content:space-between;gap:12px}
.stat-list small{color:var(--muted)}
.dlnote{margin:10px 0;color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0 8px}
.csvbox{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;margin-top:10px}
.center th,.center td{text-align:center}
.striped tbody tr:nth-child(even){background:var(--bg)}
.field .req{color:var(--bad);margin-left:1px}
.modal.at{padding:0;width:min(500px,94vw)}
.at-body{padding:18px 14px 16px}
.at-two{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;margin-bottom:16px}
.at-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:4px 8px;min-height:36px;position:relative}
.at-box select{border:0;background:transparent;flex:1;min-width:110px;color:var(--muted)}
.at-x{border:0;background:none;cursor:pointer;color:var(--muted)}
.at-input{position:relative;margin-bottom:14px}.at-input input{width:100%;padding-right:34px}.at-input .cat-info{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.at-sels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.at-help{font-size:12px;color:var(--muted);margin:6px 0 14px}
.at-row{display:flex;align-items:center;gap:10px;margin:12px 0}
.cb-in{width:140px;max-width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;text-align:center;color:inherit;border-radius:4px}
.cb-in:hover{border-color:var(--line)}.cb-in:focus{border-color:var(--accent,#d6103c);background:var(--card,#fff);outline:0}
.cat-chip{display:inline-flex;align-items:center;gap:6px;background:#d6103c;color:#fff;font-size:11px;font-weight:600;padding:6px 8px;border-radius:3px}
.cat-chip button{border:0;background:none;color:#fff;padding:0;cursor:pointer;font-size:12px;line-height:1}
.cat-users{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding:6px 0 8px;align-items:center}
.cat-users select{border:0;background:transparent;min-width:130px;color:var(--muted)}
.cat-rep{display:flex;flex-direction:column;gap:12px;margin:10px 0 4px}
.cat-rep label{display:flex;align-items:center;gap:8px;cursor:pointer}
.cat-info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1.5px solid currentColor;border-radius:50%;font-size:11px;font-weight:700;margin-left:4px;cursor:help}
.seg-del{color:var(--bad)}
.seg-eye{color:#4a90e2}.seg-edit{color:var(--accent)}
.warn{color:var(--bad);font-size:12px;margin:2px 0 0}
.noreq{text-align:center;font-size:22px;color:var(--muted);padding:34px 14px;opacity:.75}
.bigcount{font-size:34px;font-weight:600;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.tab{border:0;background:none;padding:10px 22px;border-radius:8px;color:var(--ink)}
.tab:hover{background:var(--surface)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);font-weight:500}
.center .l{text-align:left}
.inline-chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.badge-btn{border:0;background:#f2c14e;color:#4a3500;border-radius:6px;padding:2px 8px;font-size:12px;margin-left:8px}
.st-active{color:#2b7de9}.st-inactive{color:var(--bad)}
.tm-tree{display:flex;flex-direction:column;gap:10px}
.tm-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px}
.tm-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tm-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.tm-count{color:var(--muted);font-size:12.5px}
.tm-act{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn.sm{padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.tm-mem{margin-top:10px}
.tm-kids{margin:10px 0 0 18px;padding-left:16px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tm-pick{border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto;padding:4px}
.tm-pick .chk{white-space:normal}
.tm-pick .chk.dis{opacity:.55;cursor:not-allowed}
.tm-pick small{color:var(--muted);margin-left:auto}
.total{font-size:18px;white-space:nowrap;margin-right:2px}
.rep{color:var(--bad);margin-left:12px;font-weight:600}
.perm-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.perm-roles{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px}
.perm-roles button{border:0;background:none;text-align:left;padding:14px 16px;border-radius:8px;color:var(--ink)}
.perm-roles button:hover{background:var(--surface)}
.perm-roles button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.perm-panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding-bottom:64px}
.perm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 18px;border-bottom:1px solid var(--line)}
.perm-row .land{display:flex;gap:8px;align-items:center;color:var(--ink);white-space:nowrap}
.perm-row .land.off{color:var(--muted);opacity:.7}
.perm-acts{padding:2px 18px 14px;border-bottom:1px solid var(--line)}
.perm-acts h4{margin:10px 0 6px;font-size:15px}
.acts-grid{display:flex;flex-wrap:wrap;gap:0 18px}
.perm-submit{position:fixed;right:24px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (max-width:900px){.perm-wrap{grid-template-columns:minmax(0,1fr)}.perm-roles{flex-direction:row;overflow-x:auto}.perm-roles button{white-space:nowrap}}
.sumbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.sum-card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.sum-card:hover{border-color:var(--muted)}
.sum-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sum-card b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.sum-label{color:var(--muted);font-size:13px;display:flex;align-items:center}
.sum-files{color:var(--muted);font-size:18px;font-weight:700}
.pop.wide{min-width:310px}
.pop select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.repcard{margin-bottom:12px}
.repq{flex:1;min-width:220px;max-width:420px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.repbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-btn{border:0;background:var(--surface);padding:7px 14px}
.seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.repscroll{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.repscroll thead th{position:sticky;top:0}
.repscroll tfoot td{background:var(--bg);position:sticky;bottom:0}
.linkbtn{border:0;background:none;color:var(--focus);font-weight:500;padding:6px 0}
.linkbtn:hover{text-decoration:underline}
.attr-scroll{max-height:calc(100vh - 430px);min-height:300px;overflow:auto}
.attr-scroll thead th{position:sticky;top:0;z-index:1}
.sub-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:18px 0 10px}
.sub-head h2{margin:0;font-size:20px;font-weight:500}
.sub-head p{margin:2px 0 0;color:var(--muted)}
.def-note{color:var(--muted)}
.bulk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;max-width:1300px}
.bulk-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-height:90px}
.bulk-card:hover{border-color:var(--muted)}
.bc-main{display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:flex-end;width:100%;height:100%;min-height:90px;padding:12px;border:0;background:none;text-align:left;border-radius:8px}
.bc-main svg{width:24px;height:24px}
.bc-tools{position:absolute;top:6px;right:6px;display:flex;gap:2px;z-index:1}
.bc-tools .icon-btn{padding:4px;color:var(--muted)}
.bc-tools .icon-btn svg{width:15px;height:15px}
.bulk-card.add .bc-main{align-items:center;justify-content:center}
.bulk-card.add .plus{font-size:34px;line-height:1;font-weight:300}
.bulk-card.off{opacity:.55}
.plugin{display:flex;align-items:center;gap:10px;margin-top:18px}
.sw{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:0;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:#1f9d55}
.sw:checked::after{transform:translateX(16px)}
.modal.wide{width:min(900px,calc(100% - 24px))}
.paytotal{margin:12px 0}
.modal .kpis{margin:10px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.appcard{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.appcard .ai{flex:1;min-width:240px}
.appcard b{display:block;font-weight:600;margin-bottom:2px}
.appcard span{color:var(--muted);font-size:13px;line-height:1.45;display:block}
.appcard .btn{text-decoration:none;white-space:nowrap}
.pfilt{margin:12px 0;gap:8px;flex-wrap:wrap;align-items:center}
.pfilt input[type=search]{min-width:240px}
tr.pvoid td{opacity:.6}
tr.pvoid td.amt{text-decoration:line-through}
td small{color:var(--muted)}
/* ---- Disbursement lead view ---- */
.name-link{border:0;background:none;padding:0;color:var(--focus);font-weight:500;text-align:left}
.name-link:hover{text-decoration:underline}
.ld-boxbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.ld-boxbar .btn{display:inline-flex;align-items:center;gap:6px}
.ld-bar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.ld-bar .btn{display:inline-flex;align-items:center;gap:6px}.ld-prof [data-bx],.ld-sum [data-bx]{max-width:100%;min-width:0}
.ld-top{display:flex;gap:16px;align-items:stretch;margin-bottom:16px}
.ld-prof{flex:0 0 310px;border:2px solid var(--accent);border-radius:12px;background:var(--surface);padding:14px 16px;box-shadow:var(--shadow)}
.ld-who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ld-av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;flex:none}
.ld-who h1{font-size:18px;margin:0;font-weight:600}
.ld-ids{display:flex;gap:18px;font-size:12px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.ld-ids small{display:block;font-weight:600;font-size:12px;margin-bottom:2px}
.ld-stage{color:var(--focus)}
.ld-link{border:0;background:none;padding:0;color:var(--focus);text-decoration:none}
a.ld-link:hover,button.ld-link:hover{text-decoration:underline}
.ld-kv{display:grid;grid-template-columns:82px minmax(0,1fr);gap:6px;margin:0;font-size:13px;align-items:center}
.ld-kv dt{font-weight:600}
.ld-kv dd{margin:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:30px}
.ld-sum{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.ld-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 20px;margin:0}
.ld-grid dt{font-weight:600;font-size:14px;margin-bottom:6px}
.ld-grid dd{margin:0;font-size:13px;color:var(--muted)}
.ld-grid dd.acc{color:var(--accent);font-weight:600}
.ld-grid .ld-summary-wide{grid-column:1/-1;min-width:0;padding-top:8px;border-top:1px solid var(--line)}
.ld-grid .ld-summary-text{display:block;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;max-height:110px;overflow:auto}
.ld-grid .ld-history-text{max-height:150px}
.ld-ico{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}
.ld-body{margin-top:14px}
.ld-sub{margin-bottom:14px}
.ld-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.ld-box{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ld-box .ld-two{gap:0}
.ld-box .ld-tbl{border:0}
.ld-box .tscroll+.tscroll .ld-tbl{border-left:1px solid var(--line)}
.ld-boxbar{position:absolute;top:4px;right:8px;display:flex;gap:6px;z-index:2}

.ld-tbl td{padding:9px 12px;border:1px solid var(--line);vertical-align:middle}
.ld-tbl td.k{width:38%;background:var(--bg);color:var(--muted)}
.ld-tbl .req{color:var(--bad);margin-left:1px}
.ld-tbl .rv{display:flex;justify-content:flex-start;align-items:center;gap:8px}
.ld-tbl .rv-click{cursor:text;border-bottom:1px dashed transparent;min-width:40px}

.ld-tbl textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);resize:vertical}
.ld-tbl input,.ld-tbl select,.ld-kv input,.ld-kv select,.ld-who input,.ld-grid select,.ld-ids select{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface)}
@media (max-width:900px){.ld-top{flex-direction:column}.ld-prof{flex-basis:auto}.ld-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ld-two{grid-template-columns:minmax(0,1fr)}}


/* ---------- team / dealer business reports ---------- */
.biz-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.biz-filters input,.biz-filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.biz-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.biz-kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.biz-kpi b{display:block;font-size:21px;font-weight:600}
.biz-kpi span{font-size:12.5px;color:var(--muted)}
.tr-flag{color:#c43d3d;font-weight:600}
.tr-lbl{display:inline-flex;align-items:center;gap:6px}
.tr-lbl input[type=date]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px}

.biz-progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}

/* ---------- login and signed-in user ---------- */
body.locked .app{visibility:hidden}
.login{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:var(--bg);overflow:auto}
.login[hidden]{display:none}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}

/* ---------- MONTH-END RULE ----------
   A disbursed file stays in Disbursement business (under its Lead Owner) for the whole month it was disbursed in.
   It moves to PDD only once that month has ended (on the last day of the month, or later). Nothing moves earlier. */
function pddMonthEnded(d){
  var s=String(d||"").slice(0,10); if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false; /* no valid date: never move to PDD */
  var n=new Date(), today=ymd(new Date(n.getFullYear(),n.getMonth(),n.getDate()));
  var y=+s.slice(0,4), m=+s.slice(5,7);
  return today>=ymd(new Date(y,m,0)); /* m is 1-based, so day 0 of month index m is the last day of the disbursement month itself */
}

  if(stages.indexOf(key)>-1)return [key]; /* Login shows only files still at Login; once moved to any other stage they leave it */

}

function leadRows(key,noSel){

    if(!inTeam(l,f.team))return false;

    if(key.indexOf("cat")===0){if(l.cat!==key)return false;}else if(l.cat&&key!=="data"&&key!=="channel")return false;
    if(l.date<lr.from||l.date>lr.to)return false;
    if(key==="pdd"&&l.status!=="Disburse"&&l.status!==RTO_ST)return false;
    if(key==="pdd"&&!inPddNow(l))return false; /* PDD only after month end */
    if(key==="pdd"&&l.pddImp&&pddAdminHidden())return false;
    if(key==="Disbursed"&&inPddNow(l))return false; /* once its month has ended the file lives in PDD; before that it stays in Disbursement business */

    if(!noSel&&state.sel.length&&state.sel.indexOf(key==="pdd"?pddSt(l):l.status)<0)return false;

    if(f.lender&&l.lender!==f.lender)return false;
    if(f.year&&String(l.year||"")!==String(f.year))return false;
    if(f.dealer&&l.dealer!==f.dealer)return false;
    if(f.owner&&l.owner!==f.owner)return false;

/* Works out which row a lead belongs to. Dealer names are matched to the uploaded
   dealer mapping (Name, Firm Name, "Firm - Name", Dealer ID); brackets are ignored so
   "[Direct - Direct]" and "Direct - Direct" count as one dealer. */
function trResolver(mode){
  var isD=mode!=="owner",alias={};
  function dispM(m){var f=String(m.firmName||"").trim(),n=String(m.name||"").trim();return f&&n?f+" - "+n:(n||f||String(m.dealerId||"Unassigned"));}
  if(isD)channelMaster.forEach(function(m,i){
    var f=String(m.firmName||"").trim(),n=String(m.name||"").trim();
    [n,f,(f&&n?f+" - "+n:""),(f&&n?n+" - "+f:""),m.dealerId].forEach(function(a){var z=trNorm(a);if(z&&alias[z]===undefined)alias[z]=i;});
  });
  return {
    forLead:function(l){
      var raw=isD?l.dealer:l.owner,z=trNorm(raw);
      if(isD&&z&&alias[z]!==undefined){var m=channelMaster[alias[z]];return {key:"m"+alias[z],name:trClean(dispM(m)),id:m.dealerId||""};}
      return {key:z||"unassigned",name:trClean(raw),id:""};
    },
    forMaster:function(m,i){
      if(isD)return {key:"m"+i,name:trClean(dispM(m)),id:m.dealerId||""};

function trBlank(key,name){return {key:key,name:name,id:"",total:0,audience:0,login:0,hold:0,disbursed:0,rejected:0,pddPend:0,done:0,pending:0,last:"",lastAll:"",cp:{},mapped:"",mappedList:[]};}

  function bucket(r){var x=map[r.key];if(!x){x=map[r.key]=trBlank(r.key,r.name);x.id=r.id||"";}return x;}
  leads.forEach(function(l){
    var x=bucket(R.forLead(l)),d=trDate(l),amt=+l.amount||0,s=l.stage||"";
    if(d>x.lastAll&&d<=today)x.lastAll=d; /* future-dated entries are ignored for idle tracking */
    if(!trInRange(l))return;
    x.total++;
    if(s==="Audience")x.audience++;
    else if(s==="Login")x.login++;
    else if(s==="Hold")x.hold++;
    else if(s==="Rejected")x.rejected++;
    else if(s==="Disbursed"){x.disbursed++;x.done+=amt;if(l.pdd==="Pending"||l.pdd==="Overdue")x.pddPend++;}

    var c=trClean(isD?l.owner:l.dealer);x.cp[c]=(x.cp[c]||0)+1;
  });
  channelMaster.forEach(function(m,i){
    var r=R.forMaster(m,i);if(!r)return;var x=bucket(r);
    if(isD){var o=String(m.leadOwner||"").trim();if(o)x.mapped=o;}
    else x.mappedList.push(String(m.name||m.dealerId||"").trim()||"Unnamed dealer");
  });

  var rows=Object.keys(map).map(function(k){
    var x=map[k];x.conv=x.total?Math.round(x.disbursed/x.total*100):0;x.days=trDaysSince(x.lastAll);
    var cps=Object.keys(x.cp).sort(function(a,b){return x.cp[b]-x.cp[a];});x.cpN=cps.length;
    x.cpTop=cps.slice(0,3).map(function(n){return n+" ("+x.cp[n]+")";}).join(", ");

  });

    if(q)rows=rows.filter(function(x){return (x.name+" "+x.id+" "+x.mapped+" "+x.cpTop+" "+x.mappedList.join(" ")).toLowerCase().indexOf(q)>-1;});
    if(isD&&state.trInactive)rows=rows.filter(function(x){return x.days===null||x.days>TR_IDLE_DAYS;});
  }
  var s=state.trSort||"leads";
  rows.sort(function(a,b){
    if(s==="name")return a.name.localeCompare(b.name);
    if(s==="done")return b.done-a.done||b.total-a.total;
    if(s==="conv")return b.conv-a.conv||b.total-a.total;
    if(s==="idle")return (b.days===null?99999:b.days)-(a.days===null?99999:a.days);
    if(s==="recent")return b.lastAll>a.lastAll?1:(b.lastAll<a.lastAll?-1:0);

function spanLabel(a,b){var x=MON[a.getMonth()],y=MON[b.getMonth()];return a.getFullYear()===b.getFullYear()?x+"–"+y+" "+a.getFullYear():x+" "+a.getFullYear()+"–"+y+" "+b.getFullYear();}
function periodList(kind,basis){
  var t=TODAY,y=t.getFullYear(),m=t.getMonth(),len=kind==="Q"?3:6,n=kind==="Q"?8:4,sm=basis==="fy"?3:0,out=[];
  var off=((m-sm)%12+12)%12, idx=Math.floor(off/len), yr=m>=sm?y:y-1;
  for(var i=0;i<n;i++){
    var sd=new Date(yr,sm+idx*len,1), ed=new Date(yr,sm+idx*len+len,0);
    var lab=(kind==="Q"?"Q":"H")+(idx+1)+" "+(basis==="fy"?"FY "+yr+"-"+String(yr+1).slice(2):yr)+" ("+spanLabel(sd,ed)+")";
    out.push({from:ymd(sd),to:ymd(ed),label:lab});
    idx--; if(idx<0){idx=12/len-1;yr--;}
  }
  return out;
}

function removeDuplicateLeadEntries(){

  function completeness(l){var fields=["name","phone","owner","product","amount","status","stage","date","vehicle","reg","lender","dealer","note"];return fields.reduce(function(n,k){var v=l[k];return n+(v!==undefined&&v!==null&&String(v).trim()!==""&&String(v)!=="0"?1:0);},0);}

    var base=leadKey(l),stage=String(l.stage||statusStage[l.status]||"");
    if(!base){kept.push(l);return;}
    var k=base+"|"+stage;
    if(!seen[k]){seen[k]=l;kept.push(l);return;}
    var old=seen[k],winner=completeness(l)>completeness(old)?l:old,loser=winner===l?old:l;

    if(winner!==old){var ix=kept.indexOf(old);if(ix>=0)kept[ix]=winner;seen[k]=winner;}
    removed++;
  });
  if(!removed){toast("No duplicate entries found");return;}
  if(!confirm("Found "+removed+" duplicate entr"+(removed===1?"y":"ies")+". Keep the most complete record for each matching Name + Mobile + Stage, and remove the extra copies?"))return;

/* ---------- move lead by category ---------- */
function moveCats(){
  var out=[],map={"Audience":"Audience","Login":"Login Business","Hold":"Hold","Disbursed":"Disbursement Business","Rejected":"Reject Business","pdd":"PDD Status"};
  cats.forEach(function(c){
    if(c.key==="Disbursed"&&!canDo("Leads","Move to Disbursement"))return;
    if(c.key==="pdd"&&!canDo("Leads","Move to PDD"))return;
    if(!hierPageOk(c.key))return;
    if(c.built){if(map[c.key])out.push({key:c.key,name:c.name,stage:c.key==="pdd"?"Disbursed":c.key,built:true});else out.push({key:c.key,name:c.name,stage:null,built:false});} /* Channel List and Data are listed too, like the reference */
    else out.push({key:c.key,name:c.name,stage:null,built:false});
  });
  return out;
}
function moveStatuses(key){
  var c=moveCats().filter(function(x){return x.key===key;})[0]; if(!c)return [];
  if(key==="pdd")return PDD_ST.slice();
  if(key==="Disbursed")return ["Open","Disbursed","Disbursement Pending"];
  return STATUS.filter(function(x){return x[0]!==RTO_ST&&(!c.stage||x[1]===c.stage)&&hierStatusOk(x[0]);}).map(function(x){return x[0];});
}
function myOwnerName(){
  var u=userById(state.meUser);if(!u)return "";
  var list=moveOwnerOptions(),nm=String(u.name||"").trim().toLowerCase(),i;
  for(i=0;i<list.length;i++)if(list[i].toLowerCase()===nm)return list[i];
  var f=hierarchyFirst(u.name);
  if(f)for(i=0;i<list.length;i++)if(hierarchyFirst(list[i])===f)return list[i];
  return "";
}
function moveOwnerOptions(){
  var out=[],seen={};
  function add(n){n=String(n||"").trim();var k=n.toLowerCase();if(n&&!seen[k]){seen[k]=1;out.push(n);}}
  (owners||[]).forEach(add);
  (users||[]).forEach(function(u){var r=roleById(u.roleId);if(r&&r.owner)add(u.name);});
  return out.sort(function(a,b){return a.localeCompare(b);});
}
function openMoveCat(id){
  var l=id?lead(+id):curLead(); if(!l)return; state.mvId=l.id;
  var m=document.getElementById("modal"), ownerOpts=moveOwnerOptions();
  m.innerHTML='<div class="eu-head"><h2>Move Lead By Category</h2><button class="icon-btn" data-close aria-label="Close">'+ldi("close")+'</button></div>'+
   '<div class="field"><label for="mvOwner">Lead Owner<span style="color:#d6103c">*</span></label><select id="mvOwner"><option value="">Select Lead Owner</option>'+ownerOpts.map(function(o){return '<option value="'+esc(o)+'"'+(o===l.owner?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select></div>'+
   '<div class="field"><label for="mvCat">Category<span style="color:#d6103c">*</span></label><select id="mvCat"><option value="">Select Category</option>'+moveCats().map(function(c){return '<option value="'+c.key+'">'+esc(c.name)+'</option>';}).join("")+'</select></div>'+
   '<div class="field"><label for="mvStatus">Status<span style="color:#d6103c">*</span></label><select id="mvStatus"><option value="">Select Status</option></select></div>'+
   '<div class="actions"><button class="btn primary" id="mvSubmit">Submit</button></div>';
  m.classList.add("show");showOverlay(true);document.getElementById("mvOwner").focus();

function submitMoveCat(){
  var l=lead(state.mvId); if(!l)return; ensure(l);
  var no=document.getElementById("mvOwner"), ck=document.getElementById("mvCat").value, ns=document.getElementById("mvStatus").value;
  var newOwner=no?no.value:"";
  if(!newOwner){toast("Select a lead owner");if(no)no.focus();return;}
  if(!ck){toast("Select a category");document.getElementById("mvCat").focus();return;}
  if(!ns){toast("Select a status");document.getElementById("mvStatus").focus();return;}
  if(ck==="pdd"&&!(l.stage==="Disbursed"&&pddMonthEnded(l.date))){toast("Files move to PDD only at month end. This file stays in Disbursement business until then.");return;}
  var priorOwner=l.owner;
  if(priorOwner!==newOwner){l.owner=newOwner;l.hist.unshift({ts:stamp(),text:"Lead owner changed from "+(priorOwner||"Unassigned")+" to "+newOwner,type:"owner"});}
  var c=moveCats().filter(function(x){return x.key===ck;})[0], old=l.status, oldCat=l.cat;
  if(!c){toast(DENY);return;}
  if(c.built)delete l.cat; else l.cat=ck;
  if(ck==="pdd"){ /* PDD Status: lead stays a disbursed file; the chosen option is its PDD status */
    l.status="Disburse"; l.stage="Disbursed"; l.pddSt=ns; ns="Disburse";
    if(l.pdd==="—"||!l.pdd)l.pdd="Pending";
    l.hist.unshift({ts:stamp(),text:"Lead moved to "+c.name+" (PDD status "+l.pddSt+")",type:"status"});
    purgeEarlierCopies(l);saveLeads();
    closeAll();if(state.route.indexOf("lead/")===0)renderLead();else render();toast("Lead moved to "+c.name);return;
  }
  var shown=ns; /* Disbursement Business: Open / Disbursed / Disbursement Pending all keep the lead in that stage */
  if(ck==="Disbursed"&&(ns==="Open"||ns==="Disbursed")){ns="Disburse";if(shown==="Open")l.pddSt="Open";}
  l.status=ns; l.stage=statusStage[ns];
  l.pdd=l.stage==="Disbursed"?(l.pdd==="—"||!l.pdd?"Pending":l.pdd):"—";
  l.hist.unshift({ts:stamp(),text:"Lead moved to "+c.name+" ("+(old!==ns?"status "+old+" to "+ns:"status "+ns)+")",type:"status"});
  purgeEarlierCopies(l);saveLeads();
  closeAll();if(state.route.indexOf("lead/")===0)renderLead();else render();toast("Lead moved to "+c.name);
}

},true);

function submitLeadStatus(){
  var l=curLead(); if(!l)return; ensure(l);
  var r=document.querySelector('input[name="ldst"]:checked'), nt=document.getElementById("ldNote2"); if(!r||!nt)return;
  var tx=nt.value.trim(), ns=r.value, old=l.status;

  if(inPddCtx(l)){
    var po=pddSt(l);
    if(ns!==po){l.pddSt=ns;l.hist.unshift({ts:stamp(),text:"PDD status changed from "+po+" to "+ns,type:"status"});}
    l.hist.unshift({ts:stamp(),text:tx,type:"note"});
    renderLead();toast(ns!==po?"PDD status updated":"Note added");return;
  }

    l.status=ns;l.stage=statusStage[ns];
    l.pdd=l.stage==="Disbursed"?(l.pdd==="—"||!l.pdd?"Pending":l.pdd):"—";
    l.hist.unshift({ts:stamp(),text:"Status changed from "+old+" to "+ns,type:"status"});
  }
  l.hist.unshift({ts:stamp(),text:tx,type:"note"});
  purgeEarlierCopies(l);saveLeads();
  renderLead();toast(ns!==old?"Status updated":"Note added");
}

function saveDetails(){

  var changed=[];

function uKey(n){return String(n||"").toLowerCase().replace(/\s+/g," ").trim();}
/* replace=true: take the saved list as is. Otherwise MERGE the list from the shared database with this browser's users,
   so a stale copy from another device can never wipe out a newly added user. Removed users are remembered in "gone". */
function adoptUsers(j,replace){
  if(!j||!Array.isArray(j.users)||!j.users.length)return false;
  var gone=(j.gone||[]).map(uKey);
  if(!replace)usersGone.forEach(function(g){if(gone.indexOf(g)<0)gone.push(g);});
  gone=gone.filter(function(g){return !j.users.some(function(u){return uKey(u.name)===g;});}); /* SAFETY: present in the list = not removed */
  usersGone=gone;
  var out=j.users.filter(function(u){return gone.indexOf(uKey(u.name))<0;}), extra=0;
  if(!replace){
    var have={};out.forEach(function(u){have[uKey(u.name)]=1;});
    var mx=Math.max.apply(null,out.map(function(u){return u.id;}).concat([+j.next||0]));
    users.forEach(function(u){
      if(have[uKey(u.name)]||gone.indexOf(uKey(u.name))>-1)return;
      var c=u;if(out.some(function(o){return o.id===c.id;})){mx++;c.id=mx;}
      out.push(c);extra++;
    });
  }
  users=out;userNext=Math.max(+j.next||0,Math.max.apply(null,users.map(function(u){return u.id;}))+1);
  try{localStorage.setItem(USERS_KEY,JSON.stringify({users:users,next:userNext,gone:usersGone}));}catch(e){}
  return extra?"push":true;
}

    if(h==="lead"){var target=leads.filter(function(x){return String(x.id)===String(k);})[0];return !!target&&((isPartHold(target)&&(cu.holdLeadIds||[]).map(String).indexOf(String(target.id))>-1)||isSharedHRLead(target,cu))&&canDo("Leads","View lead");}

  }
  if(r==="dashboard")return canMod("Dashboard");
  if(r==="channelwise"||r==="leads/channel")return canDo("Major Reports","Channel List");
  if(h==="lead")return canDo("Leads","View lead");
  if(h==="leads"){
    if(LEAD_PAGE[k])return canDo("Leads",LEAD_PAGE[k])&&hierPageOk(k);

    if(k==="data")return canDo("Major Reports","Data");

  if(r==="data/analysis")return canDo("Major Reports","Analysis");
  if(r==="data/download")return hierIsAdmin(userById(state.meUser))&&canDo("Major Reports","Download data"); /* Admin only */

  if(r==="major/dealers")return canDo("Major Reports","Dealer details");

function doLogin(nm,pw){

  if(!u){var fm=users.filter(function(x){return hierarchyFirst(x.name)===nm;});if(fm.length===1)u=fm[0];}
  if(!u){try{var h1=JSON.parse(localStorage.getItem("avail_crm_hierarchy_v1")||"null");if(h1&&h1.__users&&adoptUsers(h1.__users))u=users.filter(function(x){return uKey(x.name)===nm;})[0];}catch(e){}}

  if(!u)return loginErr("No user found with this name. Check the spelling or ask Admin.");

function parseCSV(t){
  var rows=[],row=[],f="",q=false,i,c; t=t.replace(/^\ufeff/,"");

    c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);if(row.length>1||row[0]!=="")rows.push(row);}
  return rows;
}
function bulkImportText(text){

  });

function inWords(n){
  n=Math.round(n); if(n===0)return "Zero";
  var a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  function two(x){return x<20?a[x]:b[Math.floor(x/10)]+(x%10?" "+a[x%10]:"");}
  function three(x){return (x>=100?a[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");}
  var cr=Math.floor(n/1e7);n%=1e7;var lk=Math.floor(n/1e5);n%=1e5;var th=Math.floor(n/1e3);n%=1e3;var o=[];
  if(cr)o.push(three(cr)+" Crore"); if(lk)o.push(two(lk)+" Lakh"); if(th)o.push(two(th)+" Thousand"); if(n)o.push(three(n));
  return o.join(" ");
}

function payApply(opt){

  if(opt==="last30"){var f=new Date(TODAY);f.setDate(f.getDate()-29);r.from=ymd(f);r.to=ymd(TODAY);r.label="Last 30 days";}
  else if(opt.charAt(0)==="q"||opt.charAt(0)==="h"){var it=periodList(opt.charAt(0)==="q"?"Q":"H",state.fyBasis)[+opt.slice(1)];if(it){r.from=it.from;r.to=it.to;r.label=it.label;}}
  else{r.label=fmtDate(r.from)+" to "+fmtDate(r.to);}
}

/* In-app notifications. Set window.CRM_NOTIFY (see firebase-connector.js) to deliver to the dealer app. */
function sendDealerNotification(dealer,n){
  var rec={dealer:dealer,appId:dApp(dealer),title:n.title,body:n.body,type:n.type||"general",ts:stamp()};
  state.notifLog.push(rec);
  if(typeof window.CRM_NOTIFY!=="function")return Promise.resolve({delivered:false});
  if(!rec.appId)return Promise.reject(new Error("Set the app dealer ID with the gear icon first"));
  return Promise.resolve(window.CRM_NOTIFY(rec)).then(function(){return {delivered:true};});
}
function notifyToast(r,ok){toast(r&&r.delivered?ok:"Saved in the CRM only. Connect Firebase (firebase-connector.js) to reach the app.");}
function dEmail(d){return (state.dcfg[d]&&state.dcfg[d].email)||"";}
function payCases(dealer){var r=state.pay;return leads.filter(function(l){return l.status==="Disburse"&&!l.cat&&l.dealer&&l.date>=r.from&&l.date<=r.to&&(!dealer||l.dealer===dealer);});}
function casePayout(l){return state.paidAmt[l.id]!==undefined?state.paidAmt[l.id]:Math.round(l.amount*dRate(l.dealer)/100);}
function dealerSum(d){
  var cs=payCases(d),loan=0,tot=0,paid=0,paidN=0;
  cs.forEach(function(l){var p=casePayout(l);loan+=l.amount;tot+=p;if(state.paidAmt[l.id]!==undefined){paid+=p;paidN++;}});
  return {dealer:d,n:cs.length,loan:loan,rate:dRate(d),total:tot,paid:paid,paidN:paidN,bal:tot-paid,balN:cs.length-paidN,cases:cs};
}
function allDealerSums(){return dealers.map(dealerSum).sort(function(a,b){return b.bal-a.bal||b.total-a.total;});}

function savePay(){
  var ids=payChecked(), dealer=state.payDealer;
  if(!ids.length){toast("Tick at least one file");return;}
  var date=document.getElementById("pyDate").value; if(!date){toast("Choose the payment date");return;}
  var byId={}; dealerSum(dealer).cases.forEach(function(l){byId[l.id]=l;});
  var items=ids.map(function(id){var l=byId[id]||{};return {id:id,amount:state.payMap[id],date:l.date||"",name:l.name||"",vehicle:l.vehicle||"",reg:l.reg||"",lender:l.lender||"",loan:l.amount||0};});
  var amt=items.reduce(function(a,it){return a+it.amount;},0);
  items.forEach(function(it){state.paidAmt[it.id]=it.amount;});
  var p={id:Date.now(),dealer:dealer,dealerId:dApp(dealer),date:date,mode:document.getElementById("pyMode").value,ref:document.getElementById("pyRef").value.trim(),items:items,amount:amt,label:state.pay.label,status:"active",createdBy:whoAmI(),createdAtText:stamp()};

  persistPayment(p).catch(function(e){toast("Shown here but NOT saved to Firebase: "+(e&&e.message||e));});
  sendDealerNotification(dealer,{title:"Payment received: "+money(amt),body:money(amt)+" paid on "+fmtDate(date)+" for "+items.length+" file"+(items.length===1?"":"s")+(p.ref?". Ref "+p.ref:"")+". Open the app for details.",type:"payment",paymentId:p.id}).then(function(r){if(r&&r.delivered)toast(dealer+" notified in the app");}).catch(function(e){toast(e.message||"Payment saved, but the app notice failed");});

function confirmVoid(id){
  var p=payById(id); if(!p)return;
  var r=document.getElementById("vdReason").value.trim();
  if(!r){toast("Write a reason for cancelling");document.getElementById("vdReason").focus();return;}
  p.status="void";p.voidReason=r;p.voidedBy=whoAmI();p.voidedAtText=stamp();
  rebuildPaid();closeAll();renderPayments();toast("Payment cancelled");
  persistPayment(p).catch(function(e){toast("Cancelled here but NOT saved to Firebase: "+(e&&e.message||e));});
  sendDealerNotification(p.dealer,{title:"Payment cancelled",body:money(p.amount)+" payment of "+fmtDate(p.date)+" was cancelled. Reason: "+r,type:"payment_cancelled",paymentId:p.id}).catch(function(){});

function oldToF(r){var f=[];

  if(r.lender)f.push({field:"lender",op:"IN",vals:[r.lender]});

  if(r.min!==undefined&&r.min!=="")f.push({field:"amount",op:">=",val:String(r.min)});

function segMatch(l,f){
  if(f.field==="name"){if(!f.val)return true;var hn=l.name.toLowerCase().indexOf(f.val.toLowerCase())>-1;return f.op==="not contains"?!hn:hn;}
  if(f.field==="amount"){if(f.val===""||f.val===undefined)return true;return f.op==="<="?l.amount<=+f.val:l.amount>=+f.val;}
  if(!f.vals||!f.vals.length)return true;
  var has=f.vals.indexOf(l[f.field])>-1;return f.op==="NOT IN"?!has:has;
}

var BK={db:null,prev:null,sig:"",lastSnap:0,dels:[],snaps:[],tab:"deleted",owner:""};
var BK_KEYS=["avail_crm_users_v1","avail_crm_hierarchy_v1","avail_crm_master_records_v1","avail_crm_dealer_details_v1","avail_crm_channel_master_v1","avail_crm_payments_v1"];
function bkLS(){var o={};BK_KEYS.forEach(function(k){try{var v=localStorage.getItem(k);if(v!==null)o[k]=v;}catch(e){}});return o;}
function bkMap(a){var m={};a.forEach(function(l){m[String(l.id)]=l;});return m;}
function bkHash(s){var h=5381,i;for(i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return s.length+":"+h;}
function bkOpen(cb){try{var q=indexedDB.open("avail_crm_backup",1);
  q.onupgradeneeded=function(){var d=q.result;d.createObjectStore("snaps",{keyPath:"ts"});d.createObjectStore("data",{keyPath:"ts"});d.createObjectStore("dels",{keyPath:"uid"});};
  q.onsuccess=function(){BK.db=q.result;cb();};}catch(e){}}
function bkAll(st,cb){if(!BK.db)return cb([]);try{var r=BK.db.transaction(st).objectStore(st).getAll();r.onsuccess=function(){cb(r.result||[]);};r.onerror=function(){cb([]);};}catch(e){cb([]);}}
function bkGet(ts,cb){try{var r=BK.db.transaction("data").objectStore("data").get(ts);r.onsuccess=function(){cb(r.result);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function bkPut(st,v){try{BK.db.transaction(st,"readwrite").objectStore(st).put(v);}catch(e){}}
function bkRm(st,k){try{BK.db.transaction(st,"readwrite").objectStore(st).delete(k);}catch(e){}}
function bkSnap(reason,js,ls){
  if(!BK.db||!js||js==="[]")return;
  var sig=bkHash(js);if(sig===BK.sig)return;BK.sig=sig;BK.lastSnap=Date.now();
  var L=JSON.parse(js),ts=Date.now(),ow={};L.forEach(function(l){var o=l.owner||"Unassigned";ow[o]=(ow[o]||0)+1;});
  bkPut("data",{ts:ts,leads:js,ls:ls||bkLS()});bkPut("snaps",{ts:ts,reason:reason,n:L.length,ow:ow});
  bkAll("snaps",function(s){s.sort(function(a,b){return b.ts-a.ts;});var big=s.slice().sort(function(a,b){return b.n-a.n;})[0];
    s.slice(40).forEach(function(x){if(big&&x.ts===big.ts)return;bkRm("snaps",x.ts);bkRm("data",x.ts);});});
}
function bkDiff(prev,cur){var now=Date.now();Object.keys(prev).forEach(function(k){if(!cur[k]){var l=prev[k];bkPut("dels",{uid:k+"_"+now,id:l.id,owner:l.owner||"",lead:l,at:now});}});}
